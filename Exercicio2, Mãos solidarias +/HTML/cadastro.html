<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Mãos Solidárias</title>
    <link rel="stylesheet" href="../CSS/style.css"> 
</head>
<body>

    <div class="grid-container">
        <header>
            <h1>Formulário de Voluntariado e Apoio</h1>
        </header>

        <nav aria-label="Navegação Principal">
            <button class="menu-toggle" aria-expanded="false" aria-controls="main-menu" aria-label="Abrir Menu">
                &#9776; 
            </button>
            <ul class="nav-list" id="main-menu">
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos Sociais</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>

        <main class="main-cadastro">
            <figure class="figure-cadastro">
                <img src="../assets/Junteseanos.png" alt="Junte-se a nós" class="img-cadastro">
                <figcaption>Preencha o formulário e faça parte da nossa rede de solidariedade.</figcaption>
            </figure>

            <form id="cadastro-form">

                <fieldset>
                    <legend>1. Dados Pessoais</legend>

                    <div class="form-row form-row-personal">
                        <div>
                            <label for="nome-completo">Nome Completo</label>
                            <input type="text" id="nome-completo" name="nome-completo" placeholder="Seu nome completo" required minlength="5">
                        </div>
                        <div>
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                        </div>
                    </div>

                    <div class="form-row form-row-personal">
                        <div>
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" placeholder="999.999.999-99" required maxlength="14" onkeyup="maskCPF(this)" 
                                pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: 999.999.999-99">
                        </div>
                        <div>
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(99) 99999-9999" required maxlength="15" onkeyup="maskPhone(this)">
                        </div>
                    </div>
                    
                    <label for="data-nascimento">Data de Nascimento</label>
                    <input type="date" id="data-nascimento" name="data-nascimento" required>
                </fieldset>

                <fieldset>
                    <legend>2. Endereço</legend>
                    
                    <div class="form-row form-row-cep-address">
                        <div>
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" name="cep" placeholder="99999-999" required maxlength="9" onkeyup="maskCEP(this)"
                                pattern="\d{5}-\d{3}" title="Formato: 99999-999">
                        </div>
                        <div>
                            <label for="endereco">Endereço (Rua, Av. e Número)</label>
                            <input type="text" id="endereco" name="endereco" placeholder="Rua da Ação, 456" required>
                        </div>
                    </div>
                    
                    <div class="form-row form-row-city-state">
                        <div>
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" name="cidade" placeholder="Sua Cidade" required>
                        </div>
                        <div>
                            <label for="estado">Estado</label>
                            <input type="text" id="estado" name="estado" placeholder="Seu Estado" required>
                        </div>
                    </div>
                </fieldset>

                <button type="submit" class="btn-submit">Finalizar Cadastro</button>
                <div id="form-message" class="toast-message"></div>
            </form>
        </main>

        
        <footer>
            <p>&copy; 2025 Mãos Solidárias. Formulário com validação visual e Design System.</p>
        </footer>
    </div>

    <script>
        // Lógica para mostrar mensagens de sucesso/erro na tela (Toast Message)
        function showMessage(message, isSuccess) {
            const messageBox = document.getElementById('form-message');
            messageBox.style.display = 'block';
            messageBox.style.opacity = '1';
            messageBox.innerHTML = message;
            
            messageBox.classList.remove('success', 'error');
            if (isSuccess) {
                messageBox.classList.add('success');
            } else {
                messageBox.classList.add('error');
            }
            
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 5000);
        }

        // Funções de Máscara de Input

        function maskCPF(input) {
            let value = input.value.replace(/\D/g, '');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            if (value.length > 14) { value = value.substring(0, 14); }
            input.value = value;
        }

        function maskPhone(input) {
            let value = input.value.replace(/\D/g, "");
            value = value.substring(0, 11);

            if (value.length > 0) { value = "(" + value; }
            if (value.length > 3) { value = value.replace(/(\d{2})(\d)/, "$1) $2"); }
            if (value.length === 11) {
                value = value.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3"); 
            } else if (value.length > 9) {
                value = value.replace(/(\d{2})(\d{4})(\d{4})/, "($1) $2-$3"); 
            }
            
            input.value = value;
        }

        function maskCEP(input) {
            let value = input.value.replace(/\D/g, "");
            value = value.substring(0, 8); 

            if (value.length > 5) {
                value = value.replace(/(\d{5})(\d)/, "$1-$2");
            }

            input.value = value;
        }

        // Lógica de Envio do Formulário
        document.getElementById('cadastro-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            if (this.checkValidity()) {
                showMessage('Sucesso! Seu cadastro foi enviado. Agradecemos seu interesse em ajudar!', true);
                this.reset();
            } else {
                showMessage('Atenção! Por favor, preencha todos os campos obrigatórios e válidos corretamente.', false);
                this.reportValidity(); 
            }
        });
    </script>
</body>
</html>
